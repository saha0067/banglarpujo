<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>বাংলার পুজো</title>
<meta name="description" content="মন ভরে বাংলার ঠাকুর দেখবে তুমিও">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Tiro+Bangla&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--night:#14162e;--panel:#1e2142;--line:#33376a;--gold:#f5a623;--red:#e0342b;--text:#f3eee4;--dim:#a9abc9;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--night);color:var(--text);font:400 1rem/1.6 "Hind Siliguri",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 14px;background:rgba(10,11,30,.6)}
.logo{font:400 1.5rem "Tiro Bangla",serif;color:var(--gold)}
.acts{display:flex;gap:8px;align-items:center}
.btn{background:var(--gold);color:#2a1a00;border:0;border-radius:999px;padding:8px 16px;font:600 .95rem "Hind Siliguri",sans-serif;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.6}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.par{height:16px;border-top:3px solid var(--gold);background:repeating-linear-gradient(90deg,var(--red) 0 22px,#f3eee4 22px 26px,var(--red) 26px 48px,var(--gold) 48px 52px)}
.hero{padding:0 20px 36px;text-align:center;overflow:hidden;background:radial-gradient(ellipse 70% 60% at 50% 0,rgba(245,166,35,.28),transparent 70%),radial-gradient(circle at 15% 85%,rgba(224,52,43,.18),transparent 40%)}
.lamps{display:flex;justify-content:center;align-items:flex-start;gap:clamp(18px,6vw,56px);margin-bottom:38px}
.lamps span{width:1px;height:var(--h);background:var(--gold);position:relative}
.lamps span::after{content:"";position:absolute;left:-9px;bottom:-26px;width:19px;height:26px;border-radius:50% 50% 40% 40%;background:radial-gradient(circle at 50% 35%,#ffe08a,var(--gold) 55%,#b86a00);box-shadow:0 0 22px 6px rgba(245,166,35,.55)}
.hero h1{font:400 clamp(3.4rem,16vw,7rem)/1.15 "Tiro Bangla",serif;margin:0;background:linear-gradient(180deg,#ffe3a0,#f5a623 60%,#d9822b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 30px rgba(245,166,35,.35))}
.hero p{color:var(--dim);max-width:30ch;margin:14px auto 0;font-size:1.1rem}
.wrap{max-width:1100px;margin:0 auto;padding:8px 20px 40px}
h2{font:400 1.6rem "Tiro Bangla",serif;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:6px;height:1.3em;border-radius:3px;background:repeating-linear-gradient(var(--red) 0 6px,#f3eee4 6px 8px)}
.row{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px}
.row button{flex:none;border:1px solid var(--gold);background:var(--panel);color:var(--text);padding:10px 16px;border-radius:40px 40px 12px 12px;font:600 1.05rem "Hind Siliguri",sans-serif;cursor:pointer}
.row.p button{border-color:var(--line);border-radius:999px;padding:5px 14px;font-weight:400}
.row button.on{background:var(--gold);color:#2a1a00;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin-top:8px}
.card{background:linear-gradient(180deg,#232650,#1a1c3a);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card img,.card video{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#000}
.b{padding:12px 14px}
.b h3{margin:0;font-size:1.1rem}
.loc{display:inline-block;font-size:.85rem;color:var(--gold);border:1px solid rgba(245,166,35,.4);border-radius:99px;padding:0 10px;margin:2px 0}
.b p{margin:2px 0 8px;color:var(--dim);overflow-wrap:anywhere}
.meta{display:flex;gap:14px;font-size:.9rem;color:var(--dim);padding-top:10px;border-top:1px solid var(--line)}
.re{display:flex;gap:8px;margin-top:10px}
.re button{background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:1.2rem;cursor:pointer}
.re button.on{border-color:var(--red);background:rgba(224,52,43,.25)}
.empty{color:var(--dim)}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--gold);border-radius:16px;padding:20px;width:min(92vw,440px)}
dialog::backdrop{background:rgba(5,6,20,.75)}
dialog h3{font:400 1.5rem "Tiro Bangla",serif;margin:0 0 12px;color:var(--gold)}
form{display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:4px;color:var(--dim)}
input,select,textarea{background:var(--night);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}
.err{color:#ff8a80;margin:0}
.ok{color:#9be59b;margin:0}
.note{margin-top:8px;color:var(--dim);font-size:.9rem}
.logo{display:flex;align-items:center;gap:10px}
.lg{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}
.hl{width:120px;height:120px;margin:26px auto 0;display:block;box-shadow:0 0 30px rgba(245,166,35,.5)}
.hero .lamps{margin-bottom:20px}
dialog.big{width:min(96vw,760px);max-height:90vh;overflow:auto}
.ar{border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0;display:flex;gap:10px;flex-wrap:wrap}
.ar>img,.ar>video{width:110px;height:84px;object-fit:cover;border-radius:8px}
.ar .i{flex:1;min-width:190px;display:flex;flex-direction:column;gap:4px}
.acts{flex-wrap:wrap}.sm{padding:4px 12px;font-size:.85rem}
.btn.danger{background:var(--red);color:#fff}
</style>
</head>
<body>
<header class="bar"><span class="logo"><img data-logo alt="" class="lg"><span id="sn">বাংলার পুজো</span></span><div class="acts"><button class="btn ghost" id="adm" hidden>অ্যাডমিন</button><button class="btn ghost" id="auth"></button><button class="btn" id="up">ছবি / ভিডিও দিন</button></div></header>
<div class="par"></div>
<section class="hero"><div class="lamps" aria-hidden="true"><span style="--h:30px"></span><span style="--h:62px"></span><span style="--h:42px"></span><span style="--h:74px"></span><span style="--h:36px"></span></div><img data-logo alt="বাংলার পুজো" class="lg hl"><h1 id="h1">বাংলার পুজো</h1><p id="tg">মন ভরে বাংলার ঠাকুর দেখবে তুমিও</p></section>
<div class="wrap">
<h2>বছর বেছে নিন</h2><div class="row" id="years"></div>
<h2 id="ttl"></h2><div class="row p" id="pujas"></div>
<div class="grid" id="grid"></div>
</div>

<dialog id="login"><h3>লগইন করুন</h3>
<form id="lf" method="dialog">
<button type="button" class="btn" id="g">Google দিয়ে লগইন</button>
<label>অথবা ইমেইল দিন<input type="email" id="em" placeholder="you@example.com"></label>
<button type="button" class="btn ghost" id="ml">ইমেইলে লগইন লিংক পাঠান</button>
<p id="lm" class="ok"></p>
<button class="btn ghost">বন্ধ করুন</button>
</form></dialog>

<dialog id="upd"><h3>ছবি / ভিডিও দিন</h3>
<form id="uf">
<label>পুজো<select name="puja" id="fp"></select></label>
<label>বছর<select name="year" id="fy"></select></label>
<label>জেলা / এলাকা<input name="district" placeholder="যেমন: শেরপুর" maxlength="60"></label>
<label>ক্যাপশন<textarea name="caption" rows="3" maxlength="500" placeholder="এই পুজো সম্পর্কে দু-চার কথা"></textarea></label>
<label>ছবি বা ভিডিও (সর্বোচ্চ ৫০ MB)<input type="file" name="file" accept="image/*,video/*"></label>
<p class="err" id="ue"></p>
<button class="btn" id="us">পোস্ট করুন</button>
<button type="button" class="btn ghost" id="uc">বন্ধ করুন</button>
</form></dialog>

<dialog id="adp" class="big"><h3>অ্যাডমিন প্যানেল</h3><div class="row p" id="at"></div><div id="ab"></div><button type="button" class="btn ghost" id="ax" style="margin-top:12px">বন্ধ করুন</button></dialog>
<script>
var SB_URL="https://hhyaxcbjznyqqmdgumvr.supabase.co";
var SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhoeWF4Y2Jqem55cXFtZGd1bXZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5MjAyNzgsImV4cCI6MjEwODQ5NjI3OH0.DxQ5aMBQq_91XxXgGXDZjHjEKdQFNL6KQjUD1JOsW1U";
var sb=supabase.createClient(SB_URL,SB_KEY);
var PUJAS=["দুর্গাপুজো","কালীপুজো","সরস্বতী পুজো","লক্ষ্মীপুজো","জগদ্ধাত্রী পুজো","জন্মাষ্টমী","অন্যান্য"];
var now=new Date().getFullYear(),YEARS=[];for(var i=0;i<12;i++)YEARS.push(now-i);
var year=now,puja="",user=null,mine={},isAdmin=false;
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function bar(el,items,cur,fn,all){el.innerHTML="";(all?[""].concat(items):items).forEach(function(x){var b=document.createElement("button");b.textContent=x===""?"সব":x;if(x===cur)b.className="on";b.onclick=function(){fn(x)};el.appendChild(b)})}
function tabs(){bar($("years"),YEARS,year,function(y){year=y;tabs();load()});bar($("pujas"),PUJAS,puja,function(p){puja=p;tabs();load()},true);$("ttl").textContent=year+" সালের পুজো"}
function authBtn(){$("auth").textContent=user?"লগআউট":"লগইন"}
function needLogin(){if(user)return false;$("login").showModal();return true}
async function load(){
  var q=sb.from("posts").select("*, reactions(count)").eq("approved",true).eq("year",year).order("created_at",{ascending:false});
  if(puja)q=q.eq("puja",puja);
  var r=await q,posts=r.data||[];mine={};
  if(user&&posts.length){var m=await sb.from("reactions").select("post_id,type").eq("user_id",user.id).in("post_id",posts.map(function(p){return p.id}));(m.data||[]).forEach(function(x){mine[x.post_id]=x.type})}
  var g=$("grid");g.innerHTML="";
  if(r.error){g.innerHTML='<p class="empty">লোড করা যায়নি। একটু পরে আবার চেষ্টা করুন।</p>';return}
  if(!posts.length){g.innerHTML='<p class="empty">এখানে এখনো কিছু নেই। প্রথম ছবি বা ভিডিওটা আপনিই দিন।</p>';return}
  posts.forEach(function(p){g.appendChild(card(p))});
}
function card(p){
  var views=p.views,count=p.reactions&&p.reactions[0]?p.reactions[0].count:0;
  var k="seen"+p.id;if(!sessionStorage.getItem(k)){sessionStorage.setItem(k,"1");sb.rpc("increment_view",{pid:p.id});views++}
  var c=document.createElement("article");c.className="card";
  var media=p.media_type=="video"?'<video src="'+esc(p.media_url)+'" controls preload="metadata" playsinline></video>':'<img src="'+esc(p.media_url)+'" alt="'+esc(p.puja)+'" loading="lazy">';
  c.innerHTML=media+'<div class="b"><h3>'+esc(p.puja)+'</h3>'+(p.district?'<span class="loc">'+esc(p.district)+'</span>':'')+(p.caption?'<p>'+esc(p.caption)+'</p>':'')+'<div class="meta"><span class="vw"></span><span class="rc"></span></div><div class="re"></div></div>';
  var vw=c.querySelector(".vw"),rc=c.querySelector(".rc"),re=c.querySelector(".re");
  function paint(){vw.textContent=views+" জন দেখেছেন";rc.textContent=count+" রিঅ্যাকশন";[].forEach.call(re.children,function(b){b.className=mine[p.id]==b.textContent?"on":""})}
  ["❤️","🙏","😍"].forEach(function(e){var b=document.createElement("button");b.textContent=e;b.onclick=async function(){
    if(needLogin())return;
    if(mine[p.id]==e){await sb.from("reactions").delete().match({post_id:p.id,user_id:user.id});delete mine[p.id];count--}
    else{var x=await sb.from("reactions").upsert({post_id:p.id,user_id:user.id,type:e});if(x.error)return;if(!mine[p.id])count++;mine[p.id]=e}
    paint()};re.appendChild(b)});
  paint();return c;
}
$("auth").onclick=function(){user?sb.auth.signOut():$("login").showModal()};
$("up").onclick=function(){if(!needLogin())$("upd").showModal()};
$("g").onclick=function(){sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin}})};
$("ml").onclick=async function(){var e=$("em").value.trim();if(!e)return;var r=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.origin}});$("lm").className=r.error?"err":"ok";$("lm").textContent=r.error?"পাঠানো যায়নি: "+r.error.message:"ইমেইল পাঠানো হয়েছে। ইনবক্স খুলে লিংকে চাপুন।"};
function fillSel(){$("fp").innerHTML=PUJAS.map(function(p){return"<option>"+esc(p)+"</option>"}).join("")}fillSel();
$("fy").innerHTML=YEARS.map(function(y){return"<option>"+y+"</option>"}).join("");
$("uc").onclick=function(){$("upd").close()};
$("uf").onsubmit=async function(ev){
  ev.preventDefault();$("ue").textContent="";
  var f=new FormData(ev.target),file=f.get("file");
  if(!file||!file.size){$("ue").textContent="একটা ছবি বা ভিডিও বেছে নিন।";return}
  if(file.size>50*1024*1024){$("ue").textContent="ফাইল ৫০ MB-এর কম হতে হবে।";return}
  $("us").disabled=true;$("us").textContent="আপলোড হচ্ছে...";
  var path=user.id+"/"+Date.now()+"-"+file.name.replace(/[^\w.-]/g,"_");
  var up=await sb.storage.from("media").upload(path,file);
  if(up.error){$("ue").textContent="আপলোড হয়নি: "+up.error.message;$("us").disabled=false;$("us").textContent="পোস্ট করুন";return}
  var url=sb.storage.from("media").getPublicUrl(path).data.publicUrl;
  var ins=await sb.from("posts").insert({user_id:user.id,approved:isAdmin,puja:f.get("puja"),year:+f.get("year"),district:f.get("district")||null,caption:f.get("caption")||null,media_url:url,media_type:file.type.indexOf("video")==0?"video":"image"});
  $("us").disabled=false;$("us").textContent="পোস্ট করুন";
  if(ins.error){$("ue").textContent="সেভ হয়নি: "+ins.error.message;return}
  ev.target.reset();$("upd").close();if(!isAdmin)alert("ধন্যবাদ! আপনার পোস্ট জমা হয়েছে। অ্যাডমিন অনুমোদন করলে সাইটে দেখা যাবে।");year=+f.get("year");tabs();load();

[].forEach.call(document.querySelectorAll("[data-logo]"),function(i){i.src=LOGO});
var fi=document.createElement("link");fi.rel="icon";fi.href=LOGO;document.head.appendChild(fi);
function applySettings(m){
  if(m.title){$("sn").textContent=m.title;$("h1").textContent=m.title;document.title=m.title}
  if(m.tagline)$("tg").textContent=m.tagline;
  if(m.pujas){var a=m.pujas.split(",").map(function(x){return x.trim()}).filter(Boolean);if(a.length)PUJAS=a}
  fillSel();tabs()}
async function loadSettings(){var r=await sb.from("settings").select("key,value");if(r.error)return;var m={};(r.data||[]).forEach(function(x){m[x.key]=x.value});applySettings(m)}
async function onUser(u){
  user=u;authBtn();isAdmin=false;
  if(u){var md=u.user_metadata||{};
    await sb.from("profiles").upsert({id:u.id,email:u.email,name:md.full_name||md.name||null,avatar:md.avatar_url||md.picture||null,last_login:new Date().toISOString()});
    var a=await sb.from("admins").select("user_id").eq("user_id",u.id).maybeSingle();isAdmin=!!a.data}
  $("adm").hidden=!isAdmin}
var tab="pend",TABS={pend:"অপেক্ষমাণ",all:"সব পোস্ট",users:"ইউজার",set:"সেটিংস"};
function atab(t){tab=t;var r=$("at");r.innerHTML="";
  Object.keys(TABS).forEach(function(k){var b=document.createElement("button");b.textContent=TABS[k];if(k==t)b.className="on";b.onclick=function(){atab(k)};r.appendChild(b)});
  var c=$("ab");c.textContent="লোড হচ্ছে...";
  if(t=="users")users(c);else if(t=="set")settings(c);else plist(c,t=="pend")}
function mk(t,c,fn){var b=document.createElement("button");b.type="button";b.textContent=t;b.className="btn sm "+c;b.onclick=fn;return b}
async function plist(c,pend){
  var q=sb.from("posts").select("*").order("created_at",{ascending:false}).limit(100);
  if(pend)q=q.eq("approved",false);
  var r=await q;c.innerHTML="";
  if(r.error){c.textContent=r.error.message;return}
  if(!r.data.length){c.innerHTML='<p class="empty">কিছু নেই।</p>';return}
  r.data.forEach(function(p){c.appendChild(arow(p))})}
function arow(p){
  var d=document.createElement("div");d.className="ar";
  var m=p.media_type=="video"?'<video src="'+esc(p.media_url)+'" controls preload="metadata" playsinline></video>':'<img src="'+esc(p.media_url)+'" alt="">';
  var list=PUJAS.indexOf(p.puja)<0?PUJAS.concat([p.puja]):PUJAS;
  d.innerHTML=m+'<div class="i"><b>'+(p.approved?"✅ প্রকাশিত":"⏳ অপেক্ষমাণ")+'</b><select>'+list.map(function(x){return"<option>"+esc(x)+"</option>"}).join("")+'</select><input type="number" placeholder="বছর"><input placeholder="জেলা / এলাকা" maxlength="60"><textarea rows="2" maxlength="500" placeholder="ক্যাপশন"></textarea><div class="acts"></div></div>';
  var s=d.querySelector("select"),y=d.querySelector("input[type=number]"),di=d.querySelectorAll("input")[1],ca=d.querySelector("textarea"),ac=d.querySelector(".acts");
  s.value=p.puja;y.value=p.year;di.value=p.district||"";ca.value=p.caption||"";
  async function go(ap){var r=await sb.from("posts").update({puja:s.value,year:+y.value,district:di.value||null,caption:ca.value||null,approved:ap}).eq("id",p.id);if(r.error){alert(r.error.message);return}atab(tab);load()}
  ac.appendChild(p.approved?mk("লুকিয়ে রাখুন","ghost",function(){go(false)}):mk("অনুমোদন দিন","",function(){go(true)}));
  ac.appendChild(mk("সেভ","ghost",function(){go(p.approved)}));
  ac.appendChild(mk("মুছুন","danger",async function(){
    if(!confirm("এই পোস্টটি চিরতরে মুছে ফেলবেন?"))return;
    var k=(p.media_url.split("/media/")[1]||"").split("?")[0];
    await sb.from("reactions").delete().eq("post_id",p.id);
    var r=await sb.from("posts").delete().eq("id",p.id);
    if(r.error){alert(r.error.message);return}
    if(k)sb.storage.from("media").remove([decodeURIComponent(k)]);
    atab(tab);load()}));
  return d}
async function users(c){
  var r=await sb.from("profiles").select("*").order("last_login",{ascending:false});
  if(r.error){c.textContent=r.error.message;return}
  c.innerHTML="<p>মোট ইউজার: "+r.data.length+"</p>";
  var f=function(t){return t?new Date(t).toLocaleString("bn-BD"):"-"};
  r.data.forEach(function(u){var d=document.createElement("div");d.className="ar";
    d.innerHTML=(u.avatar?'<img src="'+esc(u.avatar)+'" alt="" referrerpolicy="no-referrer" style="width:48px;height:48px;border-radius:50%">':'')+'<div class="i"><b>'+esc(u.name||"নাম নেই")+'</b><span>'+esc(u.email||"")+'</span><small class="empty">প্রথম প্রবেশ: '+f(u.created_at)+'<br>শেষ প্রবেশ: '+f(u.last_login)+'</small></div>';
    c.appendChild(d)})}
function settings(c){
  c.innerHTML='<label>সাইটের নাম<input id="s_t"></label><label>ট্যাগলাইন<textarea id="s_g" rows="2"></textarea></label><label>পুজোর তালিকা (কমা দিয়ে আলাদা করুন)<input id="s_p"></label><button type="button" class="btn" id="s_b" style="margin-top:10px">সেভ করুন</button><p id="s_m"></p>';
  $("s_t").value=$("h1").textContent;$("s_g").value=$("tg").textContent;$("s_p").value=PUJAS.join(", ");
  $("s_b").onclick=async function(){
    var m={title:$("s_t").value.trim(),tagline:$("s_g").value.trim(),pujas:$("s_p").value};
    var r=await sb.from("settings").upsert(Object.keys(m).map(function(k){return{key:k,value:m[k]}}));
    $("s_m").className=r.error?"err":"ok";$("s_m").textContent=r.error?r.error.message:"সেভ হয়েছে।";
    if(!r.error)applySettings(m)}}
sb.auth.onAuthStateChange(function(_e,s){setTimeout(async function(){await onUser(s?s.user:null);if(user&&$("login").open)$("login").close();load()},0)});
$("adm").onclick=function(){$("adp").showModal();atab("pend")};
$("ax").onclick=function(){$("adp").close()};
tabs();loadSettings();
</script>
